<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>부족</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: 3D 화면(WebGL) 위에 HUD 캔버스, 그 위에 로비 메뉴·패널·터치 버튼 */
:root{
  --ink:#121925; --panel:#1b2433; --panel2:#243046; --line:#38465e; --text:#f4efe4; --mute:#a7b1c3;
  --gold:#f2b632; --gold-ink:#2a1d00; --blue:#3b78e6; --red:#e2483c; --ok:#4cc38a;
  --spring:#f2a7c3; --summer:#36b6c6; --autumn:#e5782f; --winter:#8fc3ec;
  --display:"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:var(--body);color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
table{font-size:inherit;color:inherit;border-collapse:collapse}
#app{position:fixed;inset:0;overflow:hidden;background:#9fd0ee}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

.bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.logo{font-family:var(--display);font-size:24px;line-height:1;padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;gap:10px;align-items:center;letter-spacing:.04em}
.dots{display:grid;grid-template-columns:repeat(2,7px);gap:2px}
.dots i{width:7px;height:7px;border-radius:2px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:600;font-size:13px;background:rgba(27,36,51,.9);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip.main{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.spacer{flex:1}
.label{font-size:13px;color:var(--mute);background:rgba(27,36,51,.9);border:1px solid var(--line);border-radius:999px;padding:8px 14px}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
#loadErr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink);z-index:40;text-align:center;font-size:16px;line-height:1.6}

#modal{position:absolute;inset:0;background:rgba(8,12,18,.64);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;cursor:default}
#modal button{cursor:pointer} #modal input{cursor:text}
.gate{text-align:center;max-width:380px;margin:0 auto;padding:8px 4px}
.gate .glogo{font:400 40px var(--display);color:var(--gold);margin:0 0 6px}
.gate h2{margin:0 0 6px;font-size:20px}
.gate .inp{text-align:center;font-size:20px;margin-top:10px}
.gate .gerr{min-height:20px;margin:8px 0;color:#ff8a7a;font-size:13.5px;font-weight:700}
.panel{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px clamp(16px,3vw,28px) 24px;box-shadow:0 24px 70px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.phead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.phead h2{font:400 28px/1.15 var(--display);margin:0;text-wrap:balance}
.phead p{margin:4px 0 0;color:var(--mute);font-size:14px;line-height:1.55}
.x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:18px;line-height:1}
.x:hover{border-color:var(--gold)}
.sec{margin-top:18px}
.sec h3{font-size:12px;letter-spacing:.08em;color:var(--mute);margin:0 0 8px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:84px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:14px}
.seg button.on{border-color:var(--gold);background:#3a3220;color:#ffe3a3}
.seg button:hover{border-color:var(--gold)}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0;line-height:1.5}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mode{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.mode b{font-size:15px}
.mode small{color:var(--mute);font-size:12px;line-height:1.4}
.mode.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.mode.soon{opacity:.6}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:#3b4459;color:#d7deea;align-self:flex-start}
.tag.gold{background:var(--gold);color:var(--gold-ink)}
.maps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mapc{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.mapc .sw{height:34px;border-radius:7px}
.mapc b{font-size:14px}
.mapc small{font-size:11.5px;color:var(--mute)}
.mapc.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.dice{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;background:#18202d;font-size:14px;line-height:1.55;color:var(--mute)}
.dice b{color:var(--text)}
.evlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.evc{border:1px solid var(--line);border-left:5px solid var(--ec);background:var(--panel2);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--text)}
.evc b{font:400 20px var(--display);color:var(--ec)} .evc small{display:block;color:var(--text);font-weight:700;margin:2px 0 6px} .evc p{margin:0;font-size:13px;line-height:1.5;color:var(--mute)}
.evc.on{background:#252f40;box-shadow:0 0 0 2px var(--ec) inset}
.primary{display:block;width:100%;margin-top:22px;padding:14px;border-radius:12px;border:0;background:var(--gold);color:var(--gold-ink);font:400 22px var(--display);cursor:pointer;letter-spacing:.02em}
.primary:hover{filter:brightness(1.07)}
.row2{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.row2 button{flex:1 1 160px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:15px;cursor:pointer}
.row2 button.go{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.lo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.locard{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px}
.locard.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.locard .top{display:flex;align-items:center;gap:8px}
.locard .top b{font-size:15px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ty{font-size:10.5px;color:var(--mute);font-weight:600}
.patch h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.patch h3 small{color:var(--mute);font-weight:500}
.patch ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.patch li{display:grid;grid-template-columns:72px 1fr;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.patch li b{color:var(--gold);font-size:12.5px}
.slot{background:#18202d;border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;position:relative}
.slot svg{width:30px;height:30px}
.slot .k{position:absolute;top:3px;left:6px;font-size:10px;color:var(--mute)}
.slot.soon{opacity:.55;border-style:dashed}
.wlist{display:grid;gap:8px}
.witem{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.witem svg{width:34px;height:34px;flex:none}
.witem b{font-size:14px}
.witem p{margin:2px 0 0;font-size:13px;color:var(--mute);line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile small{display:block;color:var(--mute);font-size:12px}
.tile b{font:400 24px var(--display);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--mute);font-weight:600;font-size:12px;background:#18202d}
.tbl tr:last-child td{border-bottom:0}
.tbl td.l,.tbl th.l{text-align:left}
.t0{color:#8db4ff}.t1{color:#ff8f86}
.win{color:var(--ok);font-weight:700}.lose{color:#ff8f86;font-weight:700}
.soonbox{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--mute);font-size:14px;line-height:1.55;background:#18202d}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:center}
kbd{font:700 12px var(--body);background:#0f1520;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 8px;white-space:nowrap}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f1520;color:var(--text);font:600 16px var(--body)}
.big{font:400 52px/1 var(--display);margin:0;text-align:center}
.big.w{color:var(--gold)} .big.l{color:#ff8f86} .big.d{color:var(--mute)}
.sub{text-align:center;color:var(--mute);margin:8px 0 0;font-size:14px}
.lopick{display:grid;gap:10px}
.lorow{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.lohead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.lohead .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.lohead small{color:var(--mute);font-size:12px}
.loopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.loopt{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:#18202d;cursor:pointer}
.loopt:hover{border-color:var(--gold)}
.loopt svg{width:34px;height:34px;flex:none}
.loopt b{display:block;font-size:14px}
.loopt small{display:block;font-size:12px;color:var(--mute);line-height:1.4}
.loopt.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#2c2818}
.loopt.fixed{cursor:default}
.pv{border:1px solid var(--line);border-radius:12px;background:#18202d;margin-top:10px}
.pv>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;font-weight:700;font-size:14px}
.pv>summary::-webkit-details-marker{display:none}
.pv>summary::after{content:'▾';margin-left:auto;color:var(--mute);transition:transform .15s}
.pv[open]>summary::after{transform:rotate(180deg)}
.pv>summary small{color:var(--mute);font-weight:500}
.pv>summary:hover{color:#ffe3a3}
.patch .pv ul{padding:0 12px 12px}
.setrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.setrow label{font-weight:600;font-size:14px}
.setrow output{font:400 18px var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.setrow input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold)}
#friendDock{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 76px);z-index:5;width:176px;background:rgba(27,36,51,.92);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
#friendDock h4{margin:0;font-size:12px;letter-spacing:.06em;color:var(--mute);display:flex;align-items:center;gap:6px}
.fslots{display:flex;gap:6px}
.fslot{flex:1;aspect-ratio:1;border-radius:10px;border:1px dashed var(--line);background:#18202d;display:grid;place-items:center;color:var(--mute);font-size:18px;cursor:pointer;padding:0}
.fslot:hover{border-color:var(--gold);color:var(--gold)}
.fslot.me{border-style:solid;border-color:var(--gold);color:var(--gold);font-size:12px;font-weight:700;cursor:default}
.fbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border-radius:10px;border:0;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:13.5px;cursor:pointer}
.fbtn:hover{filter:brightness(1.07)}
.fbtn svg{width:16px;height:16px}
@media (max-width:720px){#friendDock{top:calc(env(safe-area-inset-top,0px) + 128px);width:148px}}
.lomain{display:grid;grid-template-columns:232px minmax(0,1fr);gap:14px;align-items:start}
.lolist{display:grid;gap:8px}
.lorowbtn{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:12px 10px 10px 30px;border-radius:14px;border:2px solid transparent;background:rgba(58,64,78,.9);cursor:pointer;text-align:left}
.lorowbtn:hover{border-color:rgba(207,226,255,.5)}
.lorowbtn.act{background:#3b8bf0;border-color:#cfe2ff}
.lorowbtn .num{position:absolute;left:10px;top:7px;font-weight:700;font-size:14px}
.lorowbtn .ic{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.lorowbtn .ic svg{width:28px;height:28px}
.lorowbtn .ic.off{opacity:.25}
.lorowbtn .ic.arm{background:rgba(0,0,0,.18)}
.lorowbtn .tags{flex-basis:100%;display:flex;gap:4px;flex-wrap:wrap}
.lorowbtn .tags:empty{display:none}
.loopt.locked{opacity:.45}
/* v10: 프리미엄 (황금사과) 노란색으로 눈에 띄게 */
.loopt.prem{border-color:#f2b632;background:linear-gradient(135deg,#3a2e0c,#1c1a10 70%);box-shadow:0 0 0 1px rgba(242,182,50,.35),0 0 14px rgba(255,211,77,.25)}
.loopt.prem b{color:#ffd34d}
.loopt.prem.on{box-shadow:inset 0 0 0 2px #ffd34d,0 0 18px rgba(255,211,77,.45);background:linear-gradient(135deg,#5a4510,#2c2410 70%)}
.prem-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:linear-gradient(90deg,#ffe27a,#f2b632);color:#2a1d00;font-size:10.5px;font-weight:800;vertical-align:middle;letter-spacing:.02em}
.witem.prem{border-color:#f2b632;background:linear-gradient(135deg,#3a2e0c,#1c1a10 70%)}
.witem.prem b{color:#ffd34d}
.lorowbtn .ic.prem{background:rgba(242,182,50,.28);box-shadow:inset 0 0 0 1px #f2b632}
/* v10: 캐릭터 꾸미기 */
.cz{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.cz canvas{width:220px;height:260px;border-radius:14px;background:linear-gradient(#a7d8f2,#86b65e);border:1px solid var(--line)}
.cz .sw{display:flex;flex-wrap:wrap;gap:6px}
.cz .sw button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0}
.cz .sw button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.cz .opt{display:flex;flex-wrap:wrap;gap:6px}
.cz .opt button{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:13px}
.cz .opt button.on{border-color:var(--gold);background:#3a3220;color:#ffe3a3}
.cz .sec{margin-top:0;margin-bottom:12px}
@media (max-width:720px){.cz{grid-template-columns:1fr}.cz canvas{margin:0 auto;display:block}}
.keylist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.keyrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px;font-size:13.5px}
.keybtn{min-width:76px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);border-bottom-width:2px;background:#0f1520;font:700 13px var(--body);cursor:pointer}
.keybtn:hover{border-color:var(--gold)}
.keybtn.wait{border-color:var(--gold);color:var(--gold)}
@media (max-width:720px){.lomain{grid-template-columns:1fr}.keylist{grid-template-columns:1fr}}

#touch{position:absolute;inset:0;pointer-events:none;z-index:6}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:132px;height:132px;border-radius:50%;background:rgba(18,25,37,.25);border:2px solid rgba(244,239,228,.45);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(244,239,228,.45);border:2px solid rgba(244,239,228,.7)}
#tbtns{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
#tbtns .col{display:flex;flex-direction:column;gap:10px}
#tbtns button{border-radius:50%;border:2px solid rgba(244,239,228,.5);background:rgba(18,25,37,.6);font-weight:700;font-size:13px;width:62px;height:62px;touch-action:none}
#tbtns .bigb{width:86px;height:86px;background:rgba(242,182,50,.88);color:var(--gold-ink);border-color:var(--gold);font-size:15px}
@media (max-width:720px){
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .maps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lo{grid-template-columns:1fr}
  .logo{font-size:19px;padding:8px 11px}
  .chip{padding:7px 11px;font-size:12px}
}
@media (max-width:1200px){#matchLabel{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.fslot.in{border-style:solid;border-color:var(--ok);color:var(--text);font-size:12px;font-weight:700}
.mlist{display:grid;gap:6px;margin-top:8px}
.mrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;flex-wrap:wrap}
.mrow b{flex:1;min-width:80px}
.mteam{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#3b4459}
.mteam.t0{background:var(--blue)} .mteam.t1{background:var(--red)}
.tbtns{display:flex;gap:6px}
.tbtns button{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#0f1520;font:700 12px var(--body);cursor:pointer}
.tbtns button.on{border-color:var(--gold);color:var(--gold)}
.netst{color:var(--gold);font-size:13px;margin-top:8px}
</style>
</head>
<body>

<div id="app">
  <canvas id="gl" aria-label="부족 게임 화면"></canvas>
  <canvas id="hud"></canvas>
  <div id="safe"></div>

  <div class="bar" id="lobbyBar">

    u.bowCd -= dt; u.swordCd -= dt; u.daggerCd -= dt;
    if (u === m.player) continue;
    const n = u.net; n.age += dt; const ex = Math.min(n.age, 0.2);
    const tx = n.tx + u.vx * ex, tz = n.tz + u.vz * ex, k = Math.min(1, dt * 14);
    u.x += (tx - u.x) * k; u.z += (tz - u.z) * k; u.y += (n.ty - u.y) * Math.min(1, dt * 18);
  }
  for (const a of m.arrows) if (a.stuckT <= 0) { a.vy -= a.grav * dt; a.x += a.vx * dt; a.y = Math.max(0.05, a.y + a.vy * dt); a.z += a.vz * dt; }
  const p = m.player;
  if (p) {
    const it = playerIntent(p);
    p.face = it.aim; p.pitch = it.pitch;
    if (it.slot != null && p.alive) {
      if (!slotOk(p, it.slot)) toastOnce(armorBlocks(p.armorKind, it.slot) ? '다이아몬드 갑옷을 입으면 3번 보조무기(단검 · 새총)를 쓸 수 없어요' : `${it.slot + 1}번 칸은 쓸 수 없어요`);
      else if (it.slot < p.loadout.length) { p.slot = it.slot; N.slot = it.slot; N.slotHold = 0.5; }
    }
    if (it.heal) N.heal = true;
    if (it.fire) N.fire = true;
    if (p.alive && m.state === 'fight') {
      const w = p.loadout[p.slot];
      let mul = p.spd * (p.spdArmor || 1) * (MELEE[w] ? MELEE[w].spd : 1); if (p.hornT > 0) mul *= HEALS.horn.buff; if (p.charging || p.spearCh) mul *= 0.6; if (p.healing) mul *= healOf(p).horn ? 0.8 : 0.45;
      let mx = it.mx, mz = it.mz, jump = !!it.jump;
      if (p.dashT > 0) { p.dashT -= dt; mx = Math.cos(p.dashA); mz = Math.sin(p.dashA); mul = SPEAR_CH.dashSpd; jump = false; }
      moveUnit(p, m.map, dt, mx, mz, mul, jump);
      if (!(p.dashT > 0)) for (const o of m.units) { // 다른 캐릭터와 겹치지 않게 (나만 밀려남)
        if (o === p || !o.alive || Math.abs(o.y - p.y) > 1.8) continue;
        const dx = p.x - o.x, dz = p.z - o.z, dd = Math.hypot(dx, dz), min = p.r + o.r;
        if (dd < min && dd > 1e-4) { p.x += dx / dd * (min - dd) * 0.5; p.z += dz / dd * (min - dd) * 0.5; }
      }
    }
    N.sendT += dt;
    if (N.sendT >= 1 / 30) { // 1초에 30번 보냄
      N.sendT = 0;
      const ap = p.aimPoint, ey = APP.fpEye;
      netSend({ t: 'in', x: r2(p.x), y: r2(p.y), z: r2(p.z), vx: r2(p.vx), vy: r2(p.vy), vz: r2(p.vz), g: p.onGround ? 1 : 0, f: r2(p.face), p: r2(p.pitch),
        fire: N.fire || it.fire, alt: !!it.alt, slot: N.slot, heal: N.heal,
        aim: ap ? { x: r2(ap.x), y: r2(ap.y), z: r2(ap.z), hit: !!ap.hit } : null, eye: ey ? { x: r2(ey.x), y: r2(ey.y), z: r2(ey.z), fx: r2(ey.fx), fy: r2(ey.fy), fz: r2(ey.fz) } : null });
      N.fire = false; N.slot = null; N.heal = false;
    }
  } else if (m.done && !N.endShown) {
    N.endShown = true;
    setTimeout(() => { if (APP.match === m) { goLobby(); toast('경기가 끝났어요 · ' + (m.winner >= 0 ? TEAM[m.winner].name + ' 팀 승리' : '무승부')); } }, 2500);
  }
}
function netLeaveMatch(m) { // 경기에서 나감 (방에는 그대로)
  const N = m.net; if (!N) return;
  m.net = null;
  if (N.host) hostBroadcast({ t: 'abort' });
  else if (!m.done) netSend({ t: 'leave' });
  if (N.host) setTimeout(netRoomSync, 0);
}

/* ---------- 화면 (방 칸 · 친구 칸 · 순위) ---------- */
function roomSecHtml() {
  if (!inRoom()) {
    return `<div class="sec"><h3>방</h3>
      ${NET.status ? `<p class="netst">${esc(NET.status)}</p>` : `<div class="row2" style="margin-top:0"><button class="go" id="rmCreate">방 만들기</button></div>`}
      <div class="row2"><input class="inp" id="rmCode" maxlength="8" placeholder="방 코드 (예: K7Q2M)" aria-label="방 코드" autocomplete="off" style="flex:2 1 160px;text-transform:uppercase"><button id="rmJoin">들어가기</button><button id="rmWatch">관전으로 들어가기</button></div>
      <p class="hint">방을 만들면 초대 링크가 생겨요. 친구가 링크를 열거나 코드를 적으면 같은 방에 들어와요. 다른 집, 다른 와이파이여도 돼요. 방장 컴퓨터가 경기를 계산하니까 방장은 게임 화면을 켜 두세요.</p></div>`;
  }
  const host = NET.role === 'host', playing = NET.room && NET.room.playing;
  const myTeam = (NET.members.find(x => x.id === NET.myId) || {}).team;
  const mem = NET.members.map(x => `<div class="mrow"><span class="mteam t${x.team}">${x.team === 2 ? '관전' : TEAM[x.team].name}</span><b>${esc(x.name || '')}</b>${x.host ? '<span class="tag gold">방장</span>' : ''}${x.id === NET.myId ? '<span class="tag">나</span>' : ''}</div>`).join('');
  return `<div class="sec"><h3>방 ${esc(NET.code)}${host ? ' · 내가 방장' : ''}</h3>
    <div class="row2" style="margin-top:0"><input class="inp" id="rmLink" value="${esc(inviteLink())}" readonly aria-label="초대 링크" style="flex:2 1 220px"><button class="go" id="rmCopy">링크 복사</button></div>
    <p class="hint">이 링크를 친구에게 보내거나, 방 코드 <b style="color:var(--gold)">${esc(NET.code)}</b>를 알려 주세요. 한 방에 8명까지, 팀마다 사람 3명까지예요.</p>
    <div class="mlist">${mem}</div>
    <div class="row2"><span class="hint" style="margin:0">내 자리</span><div class="tbtns">${[[0, '파랑 팀'], [1, '빨강 팀']].concat(host ? [] : [[2, '관전']]).map(([t, n]) => `<button data-team="${t}" class="${myTeam === t ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    ${playing && !host ? '<div class="row2"><button id="rmWatchNow">지금 경기 관전하기</button></div>' : ''}
    <div class="row2"><button id="rmLeave">${host ? '방 닫기' : '방 나가기'}</button></div></div>`;
}
function copyText(t) {
  const done = () => toast('초대 링크를 복사했어요');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() { const i = $('#rmLink'); if (i) { i.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('링크를 길게 눌러 복사해 주세요'); } } }
}
function bindRoom(root) {
  const on = (sel, fn) => { const el = root.querySelector(sel); if (el) el.addEventListener('click', fn); };
  on('#rmCreate', () => netCreate());
  on('#rmJoin', () => netJoin(($('#rmCode') || {}).value));
  on('#rmWatch', () => netJoin(($('#rmCode') || {}).value, true));
  on('#rmCopy', () => copyText(inviteLink()));
  on('#rmLeave', () => netLeave());
  on('#rmWatchNow', () => netSend({ t: 'watch' }));
  root.querySelectorAll('[data-team]').forEach(b => b.addEventListener('click', () => netSetTeam(+b.dataset.team)));
  const ci = root.querySelector('#rmCode'); if (ci) APP.onEnter = () => netJoin(ci.value);
}
function roomRankHtml() {
  if (!inRoom()) return '<div class="soonbox">사람 매치 방에 들어가면, 그 방에서 함께 한 사람들의 순위를 모아 보여 줘요. 대전 게시판 → 사람 매치에서 방을 만들어 보세요.</div>';
  const rows = Object.entries(NET.rank || {}).sort((a, b) => b[1].w - a[1].w || b[1].k - a[1].k || a[1].d - b[1].d);
  if (!rows.length) return `<div class="soonbox">방 ${esc(NET.code)} · 아직 끝난 경기가 없어요. 경기를 마치면 순위가 생겨요.</div>`;
  return `<div class="tbl"><table><thead><tr><th class="l">순위</th><th class="l">이름</th><th>승리</th><th>경기</th><th>처치</th><th>쓰러짐</th></tr></thead><tbody>${rows.map(([n, r], i) => `<tr><td class="l">${i + 1}</td><td class="l">${esc(n)}${n === S.nick ? ' (나)' : ''}</td><td>${r.w}</td><td>${r.p}</td><td>${r.k}</td><td>${r.d}</td></tr>`).join('')}</tbody></table></div><p class="hint">방 ${esc(NET.code)}에서 함께 한 사람 매치 기록이에요. 방을 닫으면 사라져요.</p>`;
}
function updateDock() {
  const tag = $('#roomTag'); if (!tag) return;
  tag.textContent = inRoom() ? '방 ' + NET.code : NET.role ? '연결 중' : '초대';
  const others = NET.members.filter(x => x.id !== NET.myId);
  document.querySelectorAll('#friendDock .fslot[data-inv]').forEach((s, i) => {
    const o = others[i]; s.textContent = o ? String(o.name || '').slice(0, 3) : '+'; s.title = o ? o.name : '친구 초대'; s.classList.toggle('in', !!o);
  });
}
function refreshNetUI() {
  updateDock();
  if (!APP.modal) return;
  const kind = APP.modalKind;
  if (!((kind === 'match' && S.mode === 'human') || kind === 'friend')) return;
  const inp = $('#rmCode'), v = inp ? inp.value : '', foc = !!inp && document.activeElement === inp, sc = $('#panel').scrollTop;
  APP.onClose = null;
  if (kind === 'match') openMatchPanel(); else openFriendPanel();
  $('#panel').scrollTop = sc;
  const ni = $('#rmCode'); if (ni) { ni.value = v; if (foc) ni.focus(); }
}

/* ================= 메인 루프 ================= */
let last = performance.now(), tvFrame = 0, started = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try {
    if (APP.touchMode !== APP._touchShown) { APP._touchShown = APP.touchMode; updateUI(); }
    const tp = APP.scene === 'match' && APP.match && APP.match.player, tw = tp && tp.loadout[tp.slot], showAlt = !!(tp && APP.touchMode && tp.alive && (tw === 'spear' || tw === 'sword')) && tw;
    if (showAlt !== APP._altShown) { APP._altShown = showAlt; $('#tAlt').hidden = !showAlt; $('#tAlt').textContent = tw === 'sword' ? '방어' : '모으기'; if (!showAlt) touch.alt = false; }
    const hideCur = fpFree() && !APP.locked; // 1인칭: 게임 화면 위에서는 마우스 포인터를 숨김
    if (hideCur !== APP._curHidden) { APP._curHidden = hideCur; glc.style.cursor = hideCur ? 'none' : ''; }
    const spectating = APP.scene === 'match' && APP.match && APP.match.kind === 'spectate';
    if (APP.scene === 'lobby' || (spectating && !APP.match.net)) stepTV(dt);
    if (APP.scene === 'lobby') {
      updateLobby(dt);
      syncUnit(lobbyPlayer, dt, true);
      lobbyPlayer.vis.root.visible = S.view === 3;
      updateCamera(lobbyPlayer, lobbyCol, null, S.view === 1, dt);
      if ((tvFrame++ % 3) === 0 && APP.tv) {
        syncMatch(APP.tv, dt * 3, null);
        renderer.setRenderTarget(tvRT); renderer.render(APP.tv.scene, tvCam); renderer.setRenderTarget(null);
      }
      renderer.render(lobbyScene, camera);
      drawLobbyHUD(hctx);
    } else {
      const m = APP.match;
      if (m.net && m.net.guest) netGuestStep(m, dt); // v14: 다른 사람 화면은 방장이 보낸 상태를 그림
      else if (!spectating && (!APP.paused || m.net)) stepMatch(m, dt); // 사람 매치는 메뉴를 열어도 멈추지 않음
      if (m.net && m.net.host) netHostSend(m, dt);
      if (m.kind === 'battle' && m.done && !APP.resultsShown) { APP.resultsShown = true; releaseLock(); showResults(m); }
      if (spectating) { spectateCamera(m, dt); syncMatch(m, dt, camera.position); }
      else {
        let f = m.player; if (!f.alive) f = m.units.find(u => u.alive && u.team === f.team) || f;
        const fp = S.view === 1 && f === m.player && f.alive;
        const enemies = m.units.filter(u => u.alive && u.team !== m.player.team).map(u => u.vis.root);
        updateCamera(f, m.col, enemies, fp, dt);
        syncMatch(m, dt, camera.position);
        if (fp) m.player.vis.root.visible = false;
        APP.vmOn = fp ? drawViewModel(m.player, APP.paused ? 0 : dt) : false;
      }
      if (spectating) APP.vmOn = false;
      renderer.render(m.scene, camera);
      if (APP.vmOn) { renderer.autoClear = false; renderer.clearDepth(); renderer.render(vmScene, vmCam); renderer.autoClear = true; }
      drawHUD(hctx, m, dt);
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function drawLobbyHUD(c) {
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, VW, VH);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (S.view === 1) circle(c, VW / 2, VH / 2, 2.5, 'rgba(255,255,255,.9)', 'rgba(15,20,30,.6)', 1.5);
  if (!S.showKeys && (APP.locked || fpFree()) && !APP.near) return;
  const by = VH - SAFE.b - (APP.touchMode ? 175 : 40);
  if (APP.near) {
    const txt = APP.touchMode ? `${APP.near.name} · 열기 버튼을 누르세요` : `${kl('use')} 또는 Enter · ${APP.near.name} 열기`;
    c.font = `700 15px ${FONT_B}`; const w = c.measureText(txt).width + 34;
    c.fillStyle = '#f2b632'; rr(c, VW / 2 - w / 2, by - 19, w, 38, 19); c.fill(); c.fillStyle = '#2a1d00'; c.fillText(txt, VW / 2, by + 0.5);
    if (APP.near.id === 'loadout' || APP.near.id === 'match') {
      const t2 = `로드아웃 ${S.loIdx + 1}: ${loText(curLo().w)} · ${ARMORS[curLo().a].name}`; c.font = `600 13px ${FONT_B}`; const w2 = c.measureText(t2).width + 28;
      c.fillStyle = 'rgba(18,25,37,.85)'; rr(c, VW / 2 - w2 / 2, by - 56, w2, 28, 14); c.fill(); c.fillStyle = '#e9e4d8'; c.fillText(t2, VW / 2, by - 41.5);
    }
  } else {
    const mv = `${kl('up')}${kl('left')}${kl('down')}${kl('right')}`;
    const txt = APP.touchMode ? '왼쪽 원으로 걷고, 화면을 끌어서 둘러보세요'
      : APP.locked || APP.lockFailed ? `${mv}로 걸어서 건물 앞으로 가 보세요 · ${kl('view')} 시점 바꾸기 · Esc 마우스 풀기`
      : fpFree() ? `마우스를 움직이면 둘러봐요 · ${mv}로 걷기 · ${kl('view')} 시점 바꾸기` : `화면을 클릭하면 마우스로 둘러볼 수 있어요 · ${mv}로 걷기`;
    c.font = `600 14px ${FONT_B}`; const w = Math.min(VW - 24, c.measureText(txt).width + 30);
    c.fillStyle = 'rgba(18,25,37,.8)'; rr(c, VW / 2 - w / 2, by - 17, w, 34, 17); c.fill(); c.fillStyle = '#e9e4d8'; c.fillText(txt, VW / 2, by + 0.5);
  }
}
function start() {
  if (started) return; started = true;
  resize(); buildLobby(); APP.yaw = -Math.PI / 2; updateUI();
  openNameGate(); // v11: 이름 먼저
  requestAnimationFrame(frame);
}
resize();
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(start); setTimeout(start, 2500); } else start();
</script>
